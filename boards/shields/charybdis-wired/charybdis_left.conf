## ZMK_SPLIT_BLE stays on only because zmk-split-peripheral-input-relay does not
## compile without it. The wired transport has the higher priority and no detect
## pin, so it is always the active one and BLE never advertises for the split.
## The watchdog would restart that advertising, so it has to go.
CONFIG_CHARYBDIS_ADV_WATCHDOG=n

## ZMK excludes async (DMA) mode on nRF52 for an RX bug in this Zephyr, but the
## Kconfig choice still picks it first.
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
