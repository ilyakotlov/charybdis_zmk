# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # QWERTY BT
  - board: nice_nano_v2
    shield: charybdis_left
    keymap: qwerty
    format: bt
    artifact-name: charybdis_4x6_LEFT
  - board: nice_nano_v2
    shield: charybdis_right
    keymap: qwerty
    format: bt
    artifact-name: charybdis_4x6_RIGHT
    snippet: studio-rpc-usb-uart
    # ZMK Studio on, without the unlock key combo
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n

  # # Colemak DH BT
  # - board: nice_nano_v2
  #   shield: charybdis_left
  #   keymap: colemak_dh
  #   format: bt
  #   artifact-name: charybdis_colemak_left
  # - board: nice_nano_v2
  #   shield: charybdis_right
  #   keymap: colemak_dh
  #   format: bt
  #   artifact-name: charybdis_colemak_right
  #   snippet: studio-rpc-usb-uart

  # Diagnostic right half: no ZMK Studio, USB logging with trackball sensor data.
  # Flash only to troubleshoot the trackball, then go back to charybdis_4x6_RIGHT.
  - board: nice_nano_v2
    shield: charybdis_right
    keymap: qwerty
    format: bt
    artifact-name: charybdis_4x6_RIGHT_trackball_debug
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_PMW3610_DIAG=y

  # Firmware Reset
  - board: nice_nano_v2
    shield: settings_reset
    format: reset
    artifact-name: firmware_reset_nano_v2
