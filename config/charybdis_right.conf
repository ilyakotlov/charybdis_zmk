## Deep sleep: OFF on the right half.
##
## In bt format this half is the central and carries the trackball. Since the
## PMW3610 runs on its MOTION interrupt (P0.06, GPIO_INT_LEVEL_ACTIVE), that pin
## stays armed with nRF52 GPIO SENSE through sys_poweroff(). All SENSE pins share
## one DETECT signal; if MOTION is low when System OFF is entered (pending motion,
## or the sensor losing power with ext-power), DETECT is stuck high and key presses
## can no longer raise a wake edge. The half then sleeps until power-cycled.
## Seen in practice: after the computer slept, the right half (on battery) went
## to deep sleep and only the power switch brought it back.
##
## The left half keeps deep sleep (see charybdis_left.conf).
CONFIG_ZMK_SLEEP=n
